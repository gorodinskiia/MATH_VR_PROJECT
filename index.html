<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Babylon.js VR with Sound, Picture Boards, Donut & Cup</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = async function () {
      const scene = new BABYLON.Scene(engine);

      // Camera
      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,
        Math.PI / 2.5,
        8,
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      camera.attachControl(canvas, true);

      // Lighting
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);
      light.intensity = 0.9;

      // Skybox
      const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000.0 }, scene);
      const skyboxMaterial = new BABYLON.StandardMaterial("skyBoxMat", scene);
      skyboxMaterial.backFaceCulling = false;
      skyboxMaterial.diffuseTexture = new BABYLON.Texture("background.jpg", scene);
      skyboxMaterial.diffuseTexture.coordinatesMode = BABYLON.Texture.FIXED_EQUIRECTANGULAR_MODE;
      skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
      skybox.material = skyboxMaterial;

      // Ground
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 10, height: 10 }, scene);
      const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
      groundMaterial.diffuseTexture = new BABYLON.Texture("groundTexture.jpg", scene);
      groundMaterial.diffuseTexture.uScale = 2;
      groundMaterial.diffuseTexture.vScale = 2;
      ground.material = groundMaterial;

      // --- Picture Board Function ---
      function createPictureBoard(name, imageUrl, label, position) {
        const plane = BABYLON.MeshBuilder.CreatePlane(name + "Plane", { width: 1.5, height: 1.8 }, scene);
        plane.position = position.clone();
        plane.rotation.y = Math.PI;

        const frameThickness = 0.08;
        const frame = BABYLON.MeshBuilder.CreateBox(name + "Frame", {
          width: 1.5 + frameThickness,
          height: 1.8 + frameThickness,
          depth: 0.1
        }, scene);
        frame.position = position.clone();
        frame.position.z -= 0.06;
        const frameMat = new BABYLON.StandardMaterial(name + "FrameMat", scene);
        frameMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
        frameMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
        frame.material = frameMat;

        const standHeight = position.y - 0.05;
        const stand = BABYLON.MeshBuilder.CreateCylinder(name + "Stand", {
          height: standHeight,
          diameter: 0.05
        }, scene);
        stand.position = new BABYLON.Vector3(position.x, standHeight / 2, position.z - 0.05);
        const standMat = new BABYLON.StandardMaterial(name + "StandMat", scene);
        standMat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
        stand.material = standMat;

        const base = BABYLON.MeshBuilder.CreateCylinder(name + "Base", { height: 0.02, diameter: 0.25 }, scene);
        base.position = new BABYLON.Vector3(position.x, 0.01, position.z - 0.05);
        const baseMat = new BABYLON.StandardMaterial(name + "BaseMat", scene);
        baseMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
        base.material = baseMat;

        const texture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(plane, 1024, 1024, false);
        const stackPanel = new BABYLON.GUI.StackPanel();
        stackPanel.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
        stackPanel.height = 1;
        stackPanel.width = 1;
        texture.addControl(stackPanel);

        const text = new BABYLON.GUI.TextBlock();
        text.text = label;
        text.color = "white";
        text.fontSize = 48;
        text.height = "200px";
        text.textWrapping = true;
        text.paddingBottom = "20px";
        stackPanel.addControl(text);

        const image = new BABYLON.GUI.Image(name + "Img", imageUrl);
        image.width = 1;
        image.height = 0.8;
        image.stretch = BABYLON.GUI.Image.STRETCH_UNIFORM;
        image.paddingTop = "20px";
        stackPanel.addControl(image);

        const frameGroup = new BABYLON.TransformNode(name + "Group", scene);
        plane.parent = frameGroup;
        frame.parent = frameGroup;
        stand.parent = frameGroup;
        base.parent = frameGroup;

        return frameGroup;
      }

      // --- Picture Boards ---
      const boards = [
        ["poster1","nd.jpg","NORMAL DISTRIBUTION",2,1.2,2],
        ["poster2","bd.jpg","OTHER DISTRIBUTIONS",-2,1.2,3],
        ["poster3","guass.jpg","GAUSS",3,1.2,-1],
        ["poster4","laplace.jpg","LAPLACE",4,1.2,4],
        ["poster5","beta.jpg","BETA DISTRIBUTION",-3,1.2,-3],
        ["poster6","cauchy.jpg","CAUCHY DISTRIBUTION",0,1.2,-4],
        ["poster7","gamma.jpg","GAMMA DISTRIBUTION",5,1.2,0],
        ["poster8","gumbel.jpg","GUMBEL DISTRIBUTION",-5,1.2,1],
        ["poster9","laplace.jpg","LAPLACE",1,1.2,-5],
        ["poster10","log.jpg","LOG DISTRIBUTION",-4,1.2,5],
        ["poster11","pareto.jpg","PARETO DISTRIBUTION",4,1.2,-3],
        ["poster12","weiball.jpg","WEIBALL DISTRIBUTION",-1,1.2,4],
        ["poster13","uniform.jpg","UNIFORM DISTRIBUTION",2,1.2,-2],
        ["poster14","exponential.jpg","EXPONENTIAL DISTRIBUTION",-2,1.2,-1],
        ["poster15","hg.jpg","HYPER GEOMETRIC DISTRIBUTION",0,1.2,5]
      ];
      boards.forEach(b => createPictureBoard(b[0],b[1],b[2],new BABYLON.Vector3(b[3],b[4],b[5])));

      // --- Donut ---
      const donut = BABYLON.MeshBuilder.CreateTorus("donut", { diameter: 1.6, thickness: 0.5, tessellation: 64 }, scene);
      donut.position = new BABYLON.Vector3(-1.5, 2.2, -0.5);
      const donutMat = new BABYLON.StandardMaterial("donutMat", scene);
      donutMat.diffuseColor = new BABYLON.Color3(0.9,0.5,0.2);
      donutMat.alpha = 0; // start invisible
      donut.material = donutMat;

      // --- Solid Coffee Cup ---
      const cup = BABYLON.MeshBuilder.CreateCylinder("cup", { height: 1.1, diameterTop: 1.1, diameterBottom: 1.1, tessellation: 64 }, scene);
      cup.position = new BABYLON.Vector3(1.5, 1.6, 0.5);
      const cupMat = new BABYLON.StandardMaterial("cupMat", scene);
      cupMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.9);
      cupMat.alpha = 0; // start invisible
      cup.material = cupMat;

      // --- Handle ---
      const handle = BABYLON.MeshBuilder.CreateTorus("handle", { diameter: 0.45, thickness: 0.1, tessellation: 48 }, scene);
      handle.parent = cup;
      handle.position.set(0.55, 0.05, 0);
      handle.rotation.x = Math.PI/2;
      handle.material = cupMat;

      // --- Background Music ---
      const music = new BABYLON.Sound("backgroundMusic", "Crazy_Frog.mp3", scene, null, { loop:true, autoplay:false, volume:0.5 });
      window.addEventListener("keydown", async (event) => {
          if(event.key.toLowerCase() === "m"){
              if(!music.isPlaying){
                  await music.play();
                  console.log("Music started!");
              } else {
                  music.pause();
                  console.log("Music paused!");
              }
          }
      });

      // --- Animations (fade in/out + motion) ---
      let t = 0;
      scene.registerBeforeRender(() => {
          t += 0.01;
          const alpha = (Math.sin(t) + 1) / 2; // oscillates 0→1
          donutMat.alpha = alpha;
          cupMat.alpha = alpha;

          donut.rotation.y += 0.01;
          donut.rotation.x = Math.sin(performance.now()*0.001) * 0.05;
          cup.position.y = 1.6 + Math.sin(performance.now()*0.001*1.5)*0.08;
      });

      // --- WebXR Setup ---
      const xr = await scene.createDefaultXRExperienceAsync({ floorMeshes:[ground] });

      return scene;
    };

    (async function(){ 
      const scene = await createScene(); 
      engine.runRenderLoop(()=>scene.render()); 
    })();
    window.addEventListener("resize",()=>engine.resize());
  </script>
</body>
</html>
